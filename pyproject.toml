[project]
name = "icds-reports-flet"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "==3.14.*"
authors = [
    { name = "Pritam Dey", email = "pritam.pritamdey.984@gmail.com" }
]
dependencies = [
    # Pinned exactly: flet-datatable2 pins flet, and micropip (Pyodide) does
    # not backtrack - an unconstrained `flet` resolves to the newest release
    # and fails with "Requested flet==1.0.4, but flet==1.0.5 is installed".
    "flet==1.0.4",
    "flet-datatable2==1.0.4",
    # A range, unlike the two above. The browser gets a fixed 3.0.2 wheel from
    # the bundled Pyodide lock, while Android resolves against pypi.flet.dev,
    # which builds no 3.0.2 for CPython 3.14 and would otherwise fail with
    # "No matching distribution found". Nothing else pins pandas, so neither
    # resolver has to backtrack.
    "pandas>=3.0.2,<3.1",
]

[dependency-groups]
dev = [
    "cyclopts>=4.25.3",
    "fastapi==0.140",
    "flet-cli>=1.0.4",
    "flet-desktop>=1.0.4",
    "flet-web>=1.0.4",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.mycompany"
product = "icds-reports-flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"

[tool.flet.android]
# One ABI only. Each one carries a complete copy of the Flutter engine, the Dart
# code and CPython - 68 MB for arm64-v8a, 53 MB for the 32-bit armeabi-v7a - and
# no phone needs two. Every device that can run Android 12 is 64-bit (Play
# required 64-bit support from 2019), so the 32-bit build is dead weight here.
# x86_64, the emulator ABI, is left out for the same reason: add it on the
# command line with `--arch arm64-v8a x86_64` when testing in one.
target_arch = ["arm64-v8a"]

[tool.flet.cleanup]
# pandas and numpy ship their test suites, which nothing imports at runtime:
# 19 MB and 9 MB of the packaged site-packages. Flet's own defaults already drop
# compiled sources, stubs and __pycache__, so this is the one addition.
package_files = ["**/tests"]


[tool.pyrefly]
preset = "default"
project-includes = ["src", "tests"]
search-path = ["."]

[tool.ruff.format]
preview = true
skip-magic-trailing-comma = true

[tool.ruff]
ignore = ["E731"]
line-length = 88

[tool.ruff.lint.per-file-ignores]
".agents/**/*.py" = ["E402"]
"agent-tasks/**/*.py" = ["E402"]
"explore/**/*.py" = ["E402"]
